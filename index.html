<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0506">
  <meta name="description" content="Una carta para cata 🌷">
  <title>Flores para cata🌷🍁</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="prefetch" href="index1.html" as="document">
</head>

<body>
  <main class="container">

    <div class="envelope" id="envelope" role="button" tabindex="0"
         aria-label="Toca para abrir la carta y ver tus flores">
      <div class="envelope-inner">

        <!-- Frente de la carta -->
        <div class="envelope-front">
          <div class="postage-stamp" aria-hidden="true">🌷</div>

          <div class="address">
            <p><span>Para</span><span>Catita🐧</span></p>
            <p><span>De</span><span>Amaro</span></p>
          </div>

          <div class="seal" aria-hidden="true">❤</div>
        </div>

        <!-- Reverso con la carta -->
        <div class="envelope-back">
          <div class="top-fold"></div>

          <div class="letter">
            <img class="custom-image"
                 src="https://img.freepik.com/vector-premium/pulgar-dedos-imprimir-marca-huella-dactilar-amor-corazon_53500-1839.jpg"
                 alt="Huella con forma de corazón" loading="eager" decoding="async">

            <p>
              Para ti ✨
              <span class="highlight">¡Con cariño!</span>
            </p>

            <img class="custom-image2" src="Gunter_flores.jpg" alt="Dibujo"
                 loading="eager" decoding="async">
          </div>
        </div>

      </div>
    </div>

    <p class="hint" id="hint">Toca la carta para abrirla</p>
    <p class="status" id="status" aria-live="polite">Llevándote a tus flores 🌷</p>

  </main>

  <!-- Transición hacia las flores -->
  <div class="page-fade" id="pageFade" aria-hidden="true"></div>

  <script src="script.js" defer></script>
</body>
</html>
